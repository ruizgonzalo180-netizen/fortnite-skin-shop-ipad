<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b42">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Fortnite · Skin Shop</title>
  <link rel="icon" href="media-icon.png">
  <link rel="apple-touch-icon" href="media-apple-icon.png">
  <link rel="manifest" href="app.webmanifest">
  <link rel="stylesheet" href="shop.css">
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
 <symbol id="i-shop" viewBox="0 0 24 24"><path d="M2 3h4l1 3h15l-2.5 9h-11L5.2 5H2zM10 17a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6zm8 0a2.3 2.3 0 1 0 0 4.6 2.3 2.3 0 0 0 0-4.6z"/></symbol>
 <symbol id="i-play" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 1a11 11 0 1 1 0 22 11 11 0 0 1 0-22zm-3 5.9v10.2l8-5.1z"/></symbol>
 <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 22 2.6 12.3C-4.3 4.5 5-2.5 12 5c7-7.5 16.3-.5 9.4 7.3z"/></symbol>
 <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.2" fill="none" stroke="currentColor" stroke-width="3.5"/><path d="m14 16 6 6 2-2-6-6z"/></symbol>
 <symbol id="i-locker" viewBox="0 0 24 24"><path d="m8 3-6 3-2 5 4 2 2-3v11h12V10l2 3 4-2-2-5-6-3c-.7 2.7-7.3 2.7-8 0z"/></symbol>
 <symbol id="i-filter" viewBox="0 0 24 24"><path d="M2 4h20v3H2zm4 6h12v3H6zm4 6h4v3h-4z"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m2 12 4-4 4 4L20 2l4 4-14 15z"/></symbol>
 <symbol id="i-volume" viewBox="0 0 24 24"><path d="M2 9h4l6-5v16l-6-5H2z"/><path d="M15 8a5 5 0 0 1 0 8m3-11a9 9 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</defs></svg>
<section id="home" class="screen theater" hidden><div class="stage home-stage">
  <button class="hot home-game" aria-label="Open Fortnite" title="Open Fortnite"></button>
  <button class="hot home-recent" aria-label="Open Fortnite from Recents" title="Open Fortnite"></button>
</div></section>
<section id="loading" class="screen theater" hidden><div class="stage connecting">
  <video id="load-video" muted playsinline preload="none" poster="media-connecting.webp"></video>
  <button id="skip" class="small-button">Skip</button>
</div></section>
<section id="lobby" class="screen theater" hidden><div class="stage lobby-stage">
  <video id="lobby-video" muted loop playsinline preload="none" poster="media-lobby.webp"></video>
  <div id="lobby-wear" hidden></div>
  <button class="hot lobby-store" data-go="shop" aria-label="Open Item Shop" title="Shop"></button>
  <button class="hot lobby-locker" data-go="locker" aria-label="Open Locker" title="Locker"></button>
  <button class="hot lobby-heart" data-go="favorites" aria-label="Open Favorites"></button>
  <button class="hot lobby-find" data-go="search" aria-label="Search items"></button>
  <button class="lobby-money" data-profile aria-label="Shop profile"><span class="coin">V</span><span data-balance></span></button>
  <button class="hot lobby-profile" data-profile aria-label="Open profile"></button>
  <button class="lobby-enter yellow" data-go="shop">ITEM SHOP</button>
</div></section>
<section id="store" class="screen" hidden>
  <header class="nav">
    <nav aria-label="Fortnite menu">
      <button data-go="search" aria-label="Search" title="Search"><svg><use href="#i-search"/></svg></button>
      <button data-go="favorites" aria-label="Favorites" title="Favorites"><svg><use href="#i-heart"/></svg></button>
      <button data-go="lobby" aria-label="Lobby" title="Lobby"><svg><use href="#i-play"/></svg></button>
      <button data-go="shop" aria-label="Shop" title="Shop"><svg><use href="#i-shop"/></svg></button>
      <button data-go="locker" aria-label="Locker" title="Locker"><svg><use href="#i-locker"/></svg></button>
    </nav>
    <button class="wallet" data-profile aria-label="View demo balance"><span class="coin">V</span><span data-balance></span></button>
    <button class="avatar" data-profile aria-label="Profile and recording settings"><img src="media-avatar.webp" alt=""></button>
  </header>
  <div class="shop-body">
    <aside class="rail"><button id="filter" aria-label="Choose a collection" title="Collections"><svg><use href="#i-filter"/></svg></button><div id="dots"></div></aside>
    <main id="catalog" tabindex="-1"><div id="searchbox" hidden><label for="query">SEARCH THE SHOP</label><input id="query" type="search" placeholder="Search skins and items" autocomplete="off" spellcheck="false"></div><div id="shelves"></div></main>
  </div>
</section>
<section id="detail" class="screen theater" hidden><div class="stage detail-stage">
  <div class="detail-heading"><div class="eyebrow" id="item-type"></div><h1 id="item-name"></h1></div>
  <div class="detail-wallet"><span class="coin">V</span> <span data-balance></span></div>
  <div id="detail-model" class="model-slot"></div>
  <div class="detail-info">
    <div id="detail-thumb" class="mini-holder"></div>
    <p id="item-price"></p><p id="item-description"></p><p id="item-set"></p>
    <div class="actions"><button id="purchase" class="yellow"></button><button id="favorite" class="soft" aria-label="Favorite"><svg><use href="#i-heart"/></svg></button></div>
  </div>
  <button class="soft scene-back" id="detail-back">BACK</button>
  <div class="processing" hidden><span></span></div>
</div></section>
<section id="reward" class="screen theater" hidden><div class="stage reward-stage">
  <video id="reward-video" playsinline preload="auto" muted></video>
  <div id="reward-left" class="fallback-heading" hidden><h2>ITEMS ACQUIRED</h2><p>Thanks for playing Fortnite!</p></div>
  <div id="reward-model" class="model-slot"></div>
  <div id="reward-info"><div class="eyebrow" id="reward-type"></div><h2 id="reward-name"></h2><p id="reward-desc"></p><p id="reward-set"></p></div>
  <div id="reward-thumbs"></div>
  <div id="reward-actions"><button id="equip" class="soft">EQUIP</button><button id="claim" class="soft">CLAIM ALL</button></div>
</div></section>
<dialog id="drawer"><div class="dialog-top"><h2>COLLECTIONS</h2><button class="close" aria-label="Close">×</button></div><div id="collections"></div></dialog>
<dialog id="profile"><div class="dialog-top"><h2>SHOP PROFILE</h2><button class="close" aria-label="Close">×</button></div>
  <p class="profile-note">Purchases use demo currency in this shop.</p>
  <div class="profile-line"><span>V-Bucks</span><b data-balance></b></div>
  <div class="profile-line"><span>Demo store credit</span><b id="cash-balance"></b></div>
  <button class="profile-action" id="sound"></button><button class="profile-action" id="start-home">Open iPad home screen</button>
  <button class="profile-action" id="reset">Reset purchases</button>
  <div id="reset-confirm" hidden><p>Clear your locker and restore your demo balance?</p><button id="do-reset" class="yellow">RESET</button> <button id="no-reset" class="soft">CANCEL</button></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="catalog.js"></script><script src="shop.js"></script>
</body></html>
